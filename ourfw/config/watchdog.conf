WATCHDOG_ENABLED=1
WATCHDOG_INTERVAL=30
WATCHDOG_FAILS=3
# gateway | internet | vpn | all
WATCHDOG_SCOPE=all
# Conservative targets. Can be changed later through WebUI/SSH.
PING_TARGET1=1.1.1.1
PING_TARGET2=8.8.8.8
# Do not reboot router automatically in v0.4; only repair OURFW services.
WATCHDOG_REBOOT=0

# VPN liveness: active tunnel probe, with recent-handshake fallback.
WATCHDOG_VPN_TARGET=1.1.1.1
WATCHDOG_VPN_HANDSHAKE_MAX_AGE=180
