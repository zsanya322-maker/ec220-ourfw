# off | smart | vpn-all
ROUTING_MODE=smart
VPN_INTERFACE=wg0
ROUTE_TABLE=100
FWMARK=0x100
FWMASK=0x100
RULE_PREF=10000
KILLSWITCH=1
# block = prevent IPv6 bypass while policy VPN mode is active; native = allow normal IPv6.
IPV6_POLICY=block

# Domain rules are resolved by dnsmasq into these ipsets.
VPN_IPSET=ourfw_vpn4
DIRECT_IPSET=ourfw_direct4
