# OURFW AdBlock Lite. Generated block rules live in /tmp, not 128 KiB flash.
ADBLOCK_ENABLED=0
ADBLOCK_SOURCES_FILE=/etc/storage/ourfw/rules/adblock-sources.list
ADBLOCK_ALLOW_FILE=/etc/storage/ourfw/rules/adblock-allow.list
ADBLOCK_DENY_FILE=/etc/storage/ourfw/rules/adblock-deny.list
# Hard safety cap for MT7620/64MB. Increase only after RAM measurements.
ADBLOCK_MAX_DOMAINS=15000
ADBLOCK_REFRESH_HOURS=24
ADBLOCK_QUERY_LOG=0
