# enabled=0|1
VPN_ENABLED=0
# primary type: wireguard | amneziawg | openvpn
VPN_TYPE=wireguard
# WG/AWG interface. OpenVPN always uses tun0.
VPN_INTERFACE=wg0
VPN_PROFILE=/etc/storage/ourfw/profiles/vpn.conf
VPN_OPENVPN_PROFILE=/etc/storage/ourfw/profiles/openvpn.ovpn
VPN_OPENVPN_AUTH=/etc/storage/ourfw/profiles/openvpn.auth
# 0 = ignore static profile DNS; 1 = feed supported profile DNS to OURFW DNS module.
VPN_USE_PEER_DNS=0
# Runtime failover never rewrites persistent config. It only switches the active
# tunnel in /tmp until a manual apply/reboot returns to primary.
VPN_FAILOVER_ENABLED=0
VPN_FAILOVER_TYPE=openvpn
