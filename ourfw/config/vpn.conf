# enabled=0|1
VPN_ENABLED=0
# type=wireguard|amneziawg
VPN_TYPE=wireguard
# OURFW owns the interface and policy routing; wg0 is the supported v0.5 name.
VPN_INTERFACE=wg0
# Standard WG/AWG profile stored in persistent OURFW storage.
VPN_PROFILE=/etc/storage/ourfw/profiles/vpn.conf
# 0 = ignore profile DNS; 1 = feed profile DNS to OURFW DNS module.
VPN_USE_PEER_DNS=0
