DNS_ENABLED=1
# Optional upstream DNS servers, one per line in rules/dns-servers.list.
# Empty list = keep normal Padavan upstream behavior.
DNS_SERVERS_FILE=/etc/storage/ourfw/rules/dns-servers.list
VPN_DOMAINS_FILE=/etc/storage/ourfw/rules/vpn-domains.list
DIRECT_DOMAINS_FILE=/etc/storage/ourfw/rules/direct-domains.list
