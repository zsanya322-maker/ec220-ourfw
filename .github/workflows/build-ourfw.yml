name: Build EC220 OURFW

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/v0.7-subscription-manager
      - agent/v0.7-integration
    tags:
      - 'ourfw-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.gitlab.com/hadzhioglu/padavan-ng
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Static checks
        run: |
          if ! command -v python3 >/dev/null 2>&1; then apt-get update && apt-get install -y python3; fi
          chmod +x tests/*.sh build/*.sh tools/*.sh tools/*.py ci/*.sh ci/*.py
          sh ./tests/static-check.sh
          sh ./tests/v064-hardware-regressions.sh
          sh ./tests/v070-subscription-manager.sh
          python3 -m py_compile tools/harden-https-defaults.py tools/enable-tproxy.py tests/https-hardening-mock.py ci/verify-https-security.py
          python3 ./tests/https-hardening-mock.py

      - name: Load pinned variables
        run: |
          sed -i 's/\r$//' variables build.config
          . ./variables
          echo "PADAVAN_REPO=$PADAVAN_REPO" >> "$GITHUB_ENV"
          echo "PADAVAN_BRANCH=$PADAVAN_BRANCH" >> "$GITHUB_ENV"
          echo "PADAVAN_COMMIT=$PADAVAN_COMMIT" >> "$GITHUB_ENV"
          echo "PADAVAN_TOOLCHAIN_URL=$PADAVAN_TOOLCHAIN_URL" >> "$GITHUB_ENV"
          echo "PADAVAN_TOOLCHAIN_SHA256=$PADAVAN_TOOLCHAIN_SHA256" >> "$GITHUB_ENV"
          echo "PADAVAN_TOOLCHAIN_SIZE=$PADAVAN_TOOLCHAIN_SIZE" >> "$GITHUB_ENV"
          OURFW_VERSION=$(cat ourfw/VERSION)
          echo "OURFW_VERSION=$OURFW_VERSION" >> "$GITHUB_ENV"

      - name: Checkout exact Padavan source
        run: |
          git config --global --add safe.directory '*'
          git clone --filter=blob:none --no-checkout "$PADAVAN_REPO" padavan-ng
          git -C padavan-ng fetch --depth=1 origin "$PADAVAN_COMMIT"
          git -C padavan-ng checkout --detach FETCH_HEAD
          test "$(git -C padavan-ng rev-parse HEAD)" = "$PADAVAN_COMMIT"
          git -C padavan-ng rev-parse HEAD | tee PADAVAN_COMMIT_USED.txt

      - name: Download Padavan toolchain
        run: |
          wget -qO toolchain.tzst "$PADAVAN_TOOLCHAIN_URL"
          test "$(stat -c %s toolchain.tzst)" = "$PADAVAN_TOOLCHAIN_SIZE"
          printf '%s  %s\n' "$PADAVAN_TOOLCHAIN_SHA256" toolchain.tzst | sha256sum -c -
          sha256sum toolchain.tzst | tee TOOLCHAIN.sha256
          tar -C padavan-ng --zstd -xf toolchain.tzst

      - name: Integrate OURFW and TPROXY
        run: |
          cp build.config padavan-ng/trunk/.config
          python3 tools/apply-to-padavan.py padavan-ng
          python3 tools/enable-tproxy.py padavan-ng/trunk
          python3 tools/harden-https-defaults.py padavan-ng
          python3 tools/verify-padavan-tree.py padavan-ng
          cfg=padavan-ng/trunk/configs/boards/TPLINK/TL_EC220_G5-V2/kernel-3.4.x.config
          grep -qx 'CONFIG_EXPERIMENTAL=y' "$cfg"
          grep -qx 'CONFIG_NETFILTER_ADVANCED=y' "$cfg"
          grep -qx 'CONFIG_IP_NF_MANGLE=m' "$cfg"
          grep -qx 'CONFIG_NETFILTER_TPROXY=m' "$cfg"
          grep -qx 'CONFIG_NETFILTER_XT_TARGET_TPROXY=m' "$cfg"
          grep -qx 'CONFIG_NETFILTER_XT_MATCH_SOCKET=m' "$cfg"

      - name: Build firmware
        run: |
          pushd padavan-ng/trunk
          ./clear_tree.sh
          ./build_firmware.sh 2>&1 | tee ../../build.log
          popd

      - name: Check kernel export warnings
        run: |
          ./ci/check-kernel-export-warnings.sh build.log MODULE-EXPORTS.txt

      - name: Verify built ROMFS
        run: |
          ./ci/verify-built-romfs.sh padavan-ng build.log ROMFS-VERIFY.txt
          ./ci/verify-subscription-romfs.sh padavan-ng SUBSCRIPTION-ROMFS-VERIFY.txt
          ./ci/verify-tproxy-romfs.sh padavan-ng TPROXY-ROMFS-VERIFY.txt

      - name: Validate and prepare artifacts
        run: |
          ./ci/prepare-artifacts.sh padavan-ng dist

      - name: Verify final firmware image
        run: |
          fw=$(find dist -maxdepth 1 -type f -name "TL_EC220_G5-V2_OURFW-${OURFW_VERSION}-*.bin" -print -quit)
          test -n "$fw"
          python3 ./ci/verify-built-image.py "$fw" IMAGE-VERIFY.txt
          python3 ./ci/verify-ourfw-payload.py "$fw" PAYLOAD-VERIFY.txt
          python3 ./ci/verify-https-security.py "$fw" HTTPS-VERIFY.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: EC220-G5-v2-OURFW-${{ env.OURFW_VERSION }}-TPROXY-INTEGRATION
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*
            PADAVAN_COMMIT_USED.txt
            TOOLCHAIN.sha256
            build.log
            MODULE-EXPORTS.txt
            ROMFS-VERIFY.txt
            SUBSCRIPTION-ROMFS-VERIFY.txt
            TPROXY-ROMFS-VERIFY.txt
            IMAGE-VERIFY.txt
            PAYLOAD-VERIFY.txt
            HTTPS-VERIFY.txt

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: EC220-OURFW-build-failure
          retention-days: 7
          if-no-files-found: ignore
          path: |
            build.log
            PADAVAN_COMMIT_USED.txt
            TOOLCHAIN.sha256
            MODULE-EXPORTS.txt
            ROMFS-VERIFY.txt
            SUBSCRIPTION-ROMFS-VERIFY.txt
            TPROXY-ROMFS-VERIFY.txt
            IMAGE-VERIFY.txt
            PAYLOAD-VERIFY.txt
            HTTPS-VERIFY.txt
            padavan-ng/trunk/.config
            padavan-ng/trunk/images/*
            dist/*
