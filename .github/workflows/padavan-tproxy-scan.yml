name: Padavan TPROXY Source Scan

on:
  workflow_dispatch:
  push:
    branches:
      - agent/hy2-size-lab
    paths:
      - '.github/workflows/padavan-tproxy-scan.yml'

permissions:
  contents: read

env:
  PADAVAN_REPO: https://gitlab.com/hadzhioglu/padavan-ng.git
  PADAVAN_COMMIT: 0e6caa2749a8814345c8a0d496a2fde2e6746a7d

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact Padavan source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "$PADAVAN_REPO" padavan
          git -C padavan fetch --depth=1 origin "$PADAVAN_COMMIT"
          git -C padavan checkout --detach FETCH_HEAD
          test "$(git -C padavan rev-parse HEAD)" = "$PADAVAN_COMMIT"

      - name: Scan EC220 TPROXY source and config
        shell: bash
        run: |
          set -euo pipefail
          out=TPROXY-SOURCE-SCAN.txt
          board_cfg=padavan/trunk/configs/boards/TPLINK/TL_EC220_G5-V2/kernel-3.4.x.config
          kconfig=padavan/trunk/linux-3.4.x/net/netfilter/Kconfig
          kmake=padavan/trunk/linux-3.4.x/net/netfilter/Makefile
          ipt_ext=padavan/trunk/user/iptables/iptables-1.8.10/extensions
          test -f "$board_cfg"
          test -f "$kconfig"
          test -f "$ipt_ext/libxt_TPROXY.c"
          test -f "$ipt_ext/libxt_socket.c"

          {
            echo "TPROXY_SOURCE_SCAN=START"
            echo "PADAVAN_COMMIT=$(git -C padavan rev-parse HEAD)"
            echo "BOARD_CONFIG=$board_cfg"
            echo
            echo '=== EC220 BOARD CONFIG ==='
            grep -n -E '^(CONFIG_NETFILTER_XT_TARGET_TPROXY|CONFIG_NETFILTER_XT_MATCH_SOCKET|CONFIG_NETFILTER_XT_TARGET_MARK|CONFIG_NETFILTER_XT_MATCH_MARK|CONFIG_IP_ADVANCED_ROUTER|CONFIG_IP_MULTIPLE_TABLES|CONFIG_IP_NF_MANGLE)=|^# (CONFIG_NETFILTER_XT_TARGET_TPROXY|CONFIG_NETFILTER_XT_MATCH_SOCKET|CONFIG_NETFILTER_XT_TARGET_MARK|CONFIG_NETFILTER_XT_MATCH_MARK|CONFIG_IP_ADVANCED_ROUTER|CONFIG_IP_MULTIPLE_TABLES|CONFIG_IP_NF_MANGLE) is not set' "$board_cfg" || true
            echo
            echo '=== KERNEL SOURCE ==='
            grep -n -E '^config NETFILTER_XT_TARGET_TPROXY$|^config NETFILTER_XT_MATCH_SOCKET$' "$kconfig" || true
            grep -n -E 'CONFIG_NETFILTER_XT_TARGET_TPROXY|CONFIG_NETFILTER_XT_MATCH_SOCKET' "$kmake" || true
            test -f padavan/trunk/linux-3.4.x/net/netfilter/xt_TPROXY.c && echo 'xt_TPROXY.c=present'
            test -f padavan/trunk/linux-3.4.x/net/netfilter/xt_socket.c && echo 'xt_socket.c=present'
            echo
            echo '=== IPTABLES USERSPACE ==='
            echo 'libxt_TPROXY.c=present'
            echo 'libxt_socket.c=present'
            grep -n -E 'TPROXY|tproxy-mark|on-port|on-ip' "$ipt_ext/libxt_TPROXY.c" | sed -n '1,40p' || true
            grep -n -E 'socket|transparent|nowildcard|restore-skmark' "$ipt_ext/libxt_socket.c" | sed -n '1,40p' || true
            echo
            echo '=== OURFW BUILD CONFIG ==='
            grep -n -E 'NETFILTER|IP_NF|IP6_NF|MANGLE|NFQUEUE|TPROXY|SOCKET' build.config || true
          } | tee "$out"

          cfg_state() {
            sym=$1
            if grep -q "^${sym}=y$" "$board_cfg"; then echo y
            elif grep -q "^${sym}=m$" "$board_cfg"; then echo m
            elif grep -q "^# ${sym} is not set$" "$board_cfg"; then echo n
            else echo absent
            fi
          }

          {
            echo
            echo "KERNEL_SOURCE_TPROXY=YES"
            echo "KERNEL_SOURCE_SOCKET_MATCH=YES"
            echo "EC220_CONFIG_TPROXY=$(cfg_state CONFIG_NETFILTER_XT_TARGET_TPROXY)"
            echo "EC220_CONFIG_SOCKET_MATCH=$(cfg_state CONFIG_NETFILTER_XT_MATCH_SOCKET)"
            echo "EC220_CONFIG_IP_MULTIPLE_TABLES=$(cfg_state CONFIG_IP_MULTIPLE_TABLES)"
            echo "EC220_CONFIG_IP_NF_MANGLE=$(cfg_state CONFIG_IP_NF_MANGLE)"
            echo "IPTABLES_SOURCE_TPROXY=YES"
            echo "IPTABLES_SOURCE_SOCKET=YES"
            echo 'NOTE=final runtime availability still requires built-image or live read-only verification'
            echo "TPROXY_SOURCE_SCAN=OK"
          } | tee -a "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: padavan-tproxy-source-scan
          retention-days: 14
          if-no-files-found: error
          path: TPROXY-SOURCE-SCAN.txt
