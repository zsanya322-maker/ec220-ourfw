name: Test EC220 Hysteria2 Go 1.24 Size

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v0.7b-tproxy-hy2
    paths:
      - '.github/workflows/hysteria-go124-size.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HY_COMMIT: 14e9fff1d972ab0187ac7fcf75b9514dc8664065
      QUIC_COMMIT: 184d081eef3e9edd5cb7c0ddf2460c91f2e6adb1
      HEADROOM: '1441788'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.6'
          cache: false
      - name: Install SquashFS tools
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends squashfs-tools
      - name: Prepare no-Chrome sources
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/apernet/hysteria.git hysteria-src
          git -C hysteria-src checkout --detach "$HY_COMMIT"
          git clone --filter=blob:none https://github.com/apernet/quic-go.git quic-go-ec220
          git -C quic-go-ec220 checkout --detach "$QUIC_COMMIT"
          mkdir -p hysteria-src/app/ec220_tproxy
          cp research/hysteria/ec220_tproxy/*.go hysteria-src/app/ec220_tproxy/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hysteria-src/core/client/client.go'); s=p.read_text()
          s=s.replace('ChromeParrot:                   !c.config.QUICConfig.DisableChromeParrot,','ChromeParrot:                   false,')
          a=s.index('\tif !c.config.QUICConfig.DisableChromeParrot {'); b=s.index('\t}\n',a)+3
          p.write_text(s[:a]+s[b:])
          p=Path('quic-go-ec220/internal/handshake/crypto_setup.go'); s=p.read_text()
          s=s.replace('cs.allow0RTT = enable0RTT && !chromeParrot','cs.allow0RTT = enable0RTT')
          old='''\tif chromeParrot {\n\t\tconn, err := newUTLSQUICClient(tlsConf)\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tcs.conn = conn\n\t} else {\n\t\tcs.conn = tls.QUICClient(&tls.QUICConfig{\n\t\t\tTLSConfig:           tlsConf,\n\t\t\tEnableSessionEvents: true,\n\t\t})\n\t}\n'''
          new='''\tcs.conn = tls.QUICClient(&tls.QUICConfig{\n\t\tTLSConfig:           tlsConf,\n\t\tEnableSessionEvents: true,\n\t})\n'''
          p.write_text(s.replace(old,new))
          Path('quic-go-ec220/internal/handshake/tls_conn_utls.go').unlink()
          Path('quic-go-ec220/internal/handshake/chrome_client_hello.go').unlink()
          # Research only: lower local module/toolchain directives to test whether
          # the pinned source actually needs 1.25 language/stdlib features.
          for path in list(Path('hysteria-src').rglob('go.mod'))+[Path('quic-go-ec220/go.mod')]:
              s=path.read_text()
              import re
              s=re.sub(r'(?m)^go 1\.25(?:\.0)?$', 'go 1.24.0', s)
              s=re.sub(r'(?m)^toolchain go1\.25\.1$', 'toolchain go1.24.6', s)
              path.write_text(s)
          wp=Path('hysteria-src/go.work')
          if wp.exists():
              s=wp.read_text(); s=re.sub(r'(?m)^go 1\.25(?:\.0)?$', 'go 1.24.0', s); wp.write_text(s)
          PY
          (cd hysteria-src && GOTOOLCHAIN=local go work edit -replace github.com/apernet/quic-go=../quic-go-ec220)
      - name: Compile and measure
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local GOOS=linux GOARCH=mipsle GOMIPS=softfloat CGO_ENABLED=0
          (cd hysteria-src && go build -trimpath -gcflags=all=-l -ldflags '-s -w -buildid=' -o ../hy2-go124 ./app/ec220_tproxy)
          mkdir -p root/usr/bin && cp hy2-go124 root/usr/bin/hysteria
          mksquashfs root hy2-go124.sqfs -comp xz -b 131072 -all-root -no-exports -noappend -nopad -noI -no-xattrs >/dev/null
          raw=$(stat -c %s hy2-go124); sq=$(stat -c %s hy2-go124.sqfs)
          if [ "$sq" -le "$HEADROOM" ]; then fit=YES; else fit=NO; fi
          printf 'GO=%s\nRAW_BYTES=%s\nSQUASHFS_XZ_BYTES=%s\nHEADROOM=%s\nFIT=%s\n' "$(go version)" "$raw" "$sq" "$HEADROOM" "$fit" | tee GO124-SIZE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EC220-v0.7b-Hysteria2-go124
          retention-days: 14
          if-no-files-found: error
          path: GO124-SIZE.txt
