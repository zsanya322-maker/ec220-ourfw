name: Measure EC220 Hysteria2 Garble Tiny

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v0.7b-tproxy-hy2
    paths:
      - '.github/workflows/hysteria-garble-size.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HY_COMMIT: 14e9fff1d972ab0187ac7fcf75b9514dc8664065
      QUIC_COMMIT: 184d081eef3e9edd5cb7c0ddf2460c91f2e6adb1
      HEADROOM: '1441788'
      GARBLE_VERSION: v0.15.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: false
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends squashfs-tools
          go install mvdan.cc/garble@${GARBLE_VERSION}
          garble version | tee GARBLE-VERSION.txt
      - name: Prepare exact no-Chrome sources
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/apernet/hysteria.git hysteria-src
          git -C hysteria-src checkout --detach "$HY_COMMIT"
          git clone --filter=blob:none https://github.com/apernet/quic-go.git quic-go-ec220
          git -C quic-go-ec220 checkout --detach "$QUIC_COMMIT"
          mkdir -p hysteria-src/app/ec220_tproxy
          cp research/hysteria/ec220_tproxy/*.go hysteria-src/app/ec220_tproxy/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('hysteria-src/core/client/client.go'); s=p.read_text()
          s=s.replace('ChromeParrot:                   !c.config.QUICConfig.DisableChromeParrot,','ChromeParrot:                   false,')
          a=s.index('\tif !c.config.QUICConfig.DisableChromeParrot {'); b=s.index('\t}\n',a)+3
          p.write_text(s[:a]+s[b:])
          p=Path('quic-go-ec220/internal/handshake/crypto_setup.go'); s=p.read_text()
          s=s.replace('cs.allow0RTT = enable0RTT && !chromeParrot','cs.allow0RTT = enable0RTT')
          old='''\tif chromeParrot {\n\t\tconn, err := newUTLSQUICClient(tlsConf)\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\tcs.conn = conn\n\t} else {\n\t\tcs.conn = tls.QUICClient(&tls.QUICConfig{\n\t\t\tTLSConfig:           tlsConf,\n\t\t\tEnableSessionEvents: true,\n\t\t})\n\t}\n'''
          new='''\tcs.conn = tls.QUICClient(&tls.QUICConfig{\n\t\tTLSConfig:           tlsConf,\n\t\tEnableSessionEvents: true,\n\t})\n'''
          if old not in s: raise SystemExit('uTLS branch not found')
          p.write_text(s.replace(old,new))
          Path('quic-go-ec220/internal/handshake/tls_conn_utls.go').unlink()
          Path('quic-go-ec220/internal/handshake/chrome_client_hello.go').unlink()
          PY
          (cd hysteria-src && go work edit -replace github.com/apernet/quic-go=../quic-go-ec220)
      - name: Verify patched path before obfuscating
        run: |
          set -euo pipefail
          (cd quic-go-ec220 && go test ./internal/handshake ./internal/wire)
          (cd hysteria-src/core && go test ./client)
      - name: Build tiny EC220 binary
        run: |
          set -euo pipefail
          export GOOS=linux GOARCH=mipsle GOMIPS=softfloat CGO_ENABLED=0 GOFIPS140=off
          (cd hysteria-src && garble -tiny build -trimpath -gcflags=all=-l -ldflags='-buildid=' -o ../hy2-garble ./app/ec220_tproxy)
          file hy2-garble | tee GARBLE-FILE.txt
      - name: Measure flash footprint
        run: |
          set -euo pipefail
          mkdir -p root/usr/bin && cp hy2-garble root/usr/bin/hysteria
          mksquashfs root hy2-garble.sqfs -comp xz -b 131072 -all-root -no-exports -noappend -nopad -noI -no-xattrs >/dev/null
          raw=$(stat -c %s hy2-garble); sq=$(stat -c %s hy2-garble.sqfs)
          if [ "$sq" -le "$HEADROOM" ]; then fit=YES; else fit=NO; fi
          printf 'GARBLE=%s\nRAW_BYTES=%s\nSQUASHFS_XZ_BYTES=%s\nHEADROOM=%s\nFIT=%s\nNOTE=tiny removes panic/fatal runtime text; evaluate only if needed\n' "$GARBLE_VERSION" "$raw" "$sq" "$HEADROOM" "$fit" | tee GARBLE-SIZE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EC220-v0.7b-Hysteria2-garble-tiny
          retention-days: 14
          if-no-files-found: error
          path: |
            GARBLE-VERSION.txt
            GARBLE-FILE.txt
            GARBLE-SIZE.txt
